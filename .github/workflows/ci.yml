name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - run: npm install --no-audit --no-fund
      - name: Dependency audit summary
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log("Full dependency audit:", JSON.stringify(a.metadata?.vulnerabilities)); for (const [n,v] of Object.entries(a.vulnerabilities || {})) if (v.severity === "critical" || v.severity === "high") console.log(n, v.severity, "range=", v.range, "via=", JSON.stringify((v.via || []).map(x => typeof x === "string" ? x : x.title)), "fixAvailable=", JSON.stringify(v.fixAvailable));'
          npm audit --omit=dev --json > npm-audit-prod.json || true
          node -e 'const a=require("./npm-audit-prod.json"); console.log("Production dependency audit:", JSON.stringify(a.metadata?.vulnerabilities)); for (const [n,v] of Object.entries(a.vulnerabilities || {})) if (v.severity === "critical" || v.severity === "high") console.log("PRODUCTION", n, v.severity, "via=", JSON.stringify((v.via || []).map(x => typeof x === "string" ? x : x.title)), "fixAvailable=", JSON.stringify(v.fixAvailable));'
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CREDENTIALS_ENCRYPTION_KEY: test-encryption-key-32-chars-mini
          OPENAI_API_KEY: sk-ci-placeholder
          WHATSAPP_ACCESS_TOKEN: test
          WHATSAPP_PHONE_NUMBER_ID: test
          WHATSAPP_BUSINESS_ACCOUNT_ID: test
          WHATSAPP_VERIFY_TOKEN: test
          WHATSAPP_APP_SECRET: test
          CRON_SECRET: test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-typecheck
    if: github.event_name == 'pull_request'
    env:
      CREDENTIALS_ENCRYPTION_KEY: test-encryption-key-32-chars-mini
      OPENAI_API_KEY: sk-test
      WHATSAPP_ACCESS_TOKEN: test
      WHATSAPP_PHONE_NUMBER_ID: test
      WHATSAPP_BUSINESS_ACCOUNT_ID: test
      WHATSAPP_VERIFY_TOKEN: test
      WHATSAPP_APP_SECRET: test
      ZAINCASH_SECRET: test
      FIB_CLIENT_ID: test
      FIB_CLIENT_SECRET: test
      QICARD_USERNAME: test
      QICARD_PASSWORD: test
      QICARD_TERMINAL_ID: test
      NASSPAY_TOKEN: test
      WAYL_API_KEY: test
      WAYL_WEBHOOK_SECRET: test
      CRON_SECRET: test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_ENVIRONMENT: test
      NEXT_PUBLIC_APP_VERSION: ci
      USD_IQD_RATE: '1480'
      SAAS_CAC_USD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local
        run: supabase start

      - name: Export local Supabase credentials
        shell: bash
        run: |
          supabase status --output json > /tmp/supabase-status.json
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY' /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY' /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_POOLED_URL=$(jq -r '.DB_URL' /tmp/supabase-status.json)" >> "$GITHUB_ENV"

      - name: Run migrations and seed
        run: supabase db reset --local

      - name: Create E2E merchant account
        run: node scripts/seed-e2e-user.mjs
        env:
          E2E_OWNER_PHONE: '07701234567'
          E2E_OWNER_PASSWORD: 'Test123456'

      - name: Build Next.js
        run: npm run build

      - name: Start server
        run: npm run start > /tmp/nados-next.log 2>&1 &

      - name: Wait for server
        run: npx wait-on tcp:localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_OWNER_PHONE: '07701234567'
          E2E_OWNER_PASSWORD: 'Test123456'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
